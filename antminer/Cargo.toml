[package]
name = "antminer-api"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
digest_auth.workspace = true
mining-primitives.workspace = true
reqwest = { workspace = true, default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "antminer_client"
